spring.application.name=bluemoon-backend
server.port=8080

# Tự động nạp file .env nếu có ở thư mục gốc hoặc backend/
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bluemoon_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Xác thực JWT — đổi JWT_SECRET khi triển khai thật, không commit khóa
app.jwt.secret=${JWT_SECRET:bluemoon-dev-secret-key-change-me-0123456789abcdef}
app.jwt.expiration=${JWT_EXPIRATION:28800000}

# CORS — nhiều origin cách nhau bằng dấu phẩy
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
